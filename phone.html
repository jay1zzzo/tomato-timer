<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Today">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16130f">
<link rel="apple-touch-icon" href="phone-icon.png">
<link rel="icon" href="phone-icon.png">
<style>
  :root { --bg:#16130f; --surface:#241f18; --ink:#f6f2e8; --muted:#a39c8c; --line:#3a3329; --accent:#ff6b4a; --ok:#7fc08c; --bad:#ff7a7a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .date { color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 6px; padding: 4px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .tab { flex: 1; border: none; background: transparent; color: var(--muted); font-weight: 800; font-size: 16px; padding: 11px 8px; border-radius: 11px; }
  .tab.on { background: var(--accent); color: #1c1510; }
  .tab .n { font-family: ui-monospace, Menlo, monospace; margin-left: 4px; opacity: .85; }
  .mv { flex: none; border: 1px solid var(--line); background: transparent; color: var(--accent); font-weight: 700; font-size: 13px; border-radius: 10px; padding: 7px 10px; }
  li.done .mv { display: none; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text], input[type=password] { flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .add { border: none; background: var(--accent); color: #1c1510; font-weight: 800; font-size: 17px; border-radius: 14px; padding: 0 20px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px; }
  li.done .t { text-decoration: line-through; color: var(--muted); }
  .chk { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; color: #1c1510; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; padding: 0; }
  li.done .chk { background: var(--ok); border-color: var(--ok); }
  .t { flex: 1; font-size: 17px; line-height: 1.3; word-break: break-word; }
  .tcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .tcol .t { width: 100%; }
  .tcol .mv { font-size: 12.5px; padding: 5px 10px; }
  li { align-items: flex-start; }
  .chk, .ed, .del { align-self: flex-start; }
  .ed { flex: none; border: none; background: transparent; color: var(--muted); font-size: 18px; width: 34px; height: 34px; }
  li.edit-on .t { padding: 0; }
  .t-in { flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; padding: 8px 10px; }
  .del { flex: none; border: none; background: transparent; color: var(--muted); font-size: 20px; width: 34px; height: 34px; }
  .empty { color: var(--muted); text-align: center; padding: 26px 10px; font-size: 15px; line-height: 1.5; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; font-size: 13px; color: var(--muted); }
  .bar.ok #st { color: var(--ok); } .bar.bad #st { color: var(--bad); }
  .link { border: none; background: transparent; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 4px; }
  .setup { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
  .setup h2 { margin: 0 0 6px; font-size: 17px; } .setup p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .setup input { display: block; width: 100%; margin-bottom: 10px; }
  .setup .add { width: 100%; padding: 14px; }

  .histlink { text-align: center; margin-top: 14px; }
  .histlink .link { color: var(--muted); font-weight: 600; font-size: 13px; }
  .hist { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px); display: none; }
  .hist.on { display: block; }
  .hist-in { max-width: 560px; margin: 0 auto; }
  .hist-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .hist h2 { margin: 4px 0 2px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .hist .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; }
  .seg { display: flex; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 4px; }
  .seg button { flex: 1; border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; padding: 8px 4px; border-radius: 9px; }
  .seg button.on { background: var(--accent); color: #1c1510; }
  .day { display: flex; justify-content: space-between; margin: 16px 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; line-height: 1.3; }
  .row .tick { color: var(--ok); font-weight: 900; }
  .row .tt { word-break: break-word; }
  .row .tm { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row.edit { grid-template-columns: 1fr auto; align-items: center; }
  .row.edit input[type=text] { font-size: 15.5px; padding: 8px 10px; border-radius: 10px; width: 100%; }
  .row.edit input[type=date] { font: inherit; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; margin-top: 4px; color-scheme: dark; }
  .hacts { display: flex; gap: 8px; margin-top: 18px; }
  .hacts button { flex: 1; font-weight: 800; font-size: 15px; padding: 13px 8px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .hacts button.pri { background: var(--accent); border-color: transparent; color: #1c1510; }
  .hnote { color: var(--accent); font-size: 13px; min-height: 18px; margin: 10px 0 0; text-align: center; }
  .hempty { color: var(--muted); text-align: center; padding: 30px 8px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>Today</h1><div class="date" id="date"></div></header>

<section class="setup" id="setup" hidden>
  <h2>Connect to Tomato Timer</h2>
  <p>Paste the same GitHub token you use in Tomato Timer, so tasks you add here show up there.</p>
  <input type="text" id="repo" spellcheck="false" autocomplete="off" autocapitalize="off" value="jay1zzzo/tomato-data" aria-label="Repo">
  <input type="password" id="token" autocomplete="off" placeholder="GitHub token" aria-label="GitHub token">
  <button class="add" id="connect" type="button">Connect</button>
</section>

<div class="tabs" role="tablist"><button class="tab on" id="tabToday" type="button" role="tab">Today<span class="n" id="nToday"></span></button><button class="tab" id="tabLater" type="button" role="tab">Later<span class="n" id="nLater"></span></button></div>
<form id="form" autocomplete="off">
  <input type="text" id="input" maxlength="300" placeholder="Add a task for today" aria-label="New task" enterkeyhint="done">
  <button class="add" type="submit">Add</button>
</form>
<ul id="list"></ul>
<p class="empty" id="empty">Nothing on today&rsquo;s list. When someone gives you a task, type it above.</p>


<div class="histlink"><button class="link" id="histOpen" type="button">Past tasks <span id="histN"></span></button></div>

<section class="hist" id="hist" aria-label="Past tasks">
  <div class="hist-in">
    <div class="hist-top"><button class="link" id="histBack" type="button">&larr; Back</button><button class="link" id="histEdit" type="button">Edit</button></div>
    <h2>Work log</h2>
    <div class="sub" id="histSub"></div>
    <div class="seg" id="histSeg"><button type="button" data-r="today">Today</button><button type="button" data-r="7" class="on">7 days</button><button type="button" data-r="30">30 days</button><button type="button" data-r="all">All</button></div>
    <div id="histList"></div>
    <div class="hacts"><button class="pri" id="histShare" type="button">Export</button><button id="histCopy" type="button">Copy</button></div>
    <p class="hnote" id="histNote" role="status"></p>
  </div>
</section>

<div class="bar" id="bar"><span id="st">Not connected</span><span><button class="link" id="refresh" type="button">Refresh</button><button class="link" id="disc" type="button" hidden>Disconnect</button></span></div>

<script>
(function () {
  var TASKS_KEY = 'tomato-phone-tasks', SYNC_KEY = 'tomato-phone-sync';
  var state = { tasks: [], deleted: [] };
  var sync = { repo: '', token: '', lastOk: 0 };
  var tab = 'today', editingId = null;
  var busy = false, again = false, timer = null;
  function $(id) { return document.getElementById(id); }

  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function saveLocal() { try { localStorage.setItem(TASKS_KEY, JSON.stringify(state)); } catch (e) {} }
  function loadLocal() {
    try {
      var r = JSON.parse(localStorage.getItem(TASKS_KEY) || 'null');
      if (r && Array.isArray(r.tasks)) { state.tasks = r.tasks; state.deleted = Array.isArray(r.deleted) ? r.deleted : []; }
    } catch (e) {}
    try {
      var s = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
      if (s) { sync.repo = s.repo || ''; sync.token = s.token || ''; sync.lastOk = s.lastOk || 0; }
    } catch (e) {}
  }
  function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} }
  function syncOn() { return !!(sync.repo && sync.token); }

  function status(msg, kind) { $('st').textContent = msg; $('bar').className = 'bar' + (kind ? ' ' + kind : ''); }
  function idleStatus() {
    if (!syncOn()) { status('Not connected · tasks stay on this phone'); return; }
    var t = sync.lastOk ? new Date(sync.lastOk).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    status(t ? 'Synced ' + t : 'Connected', 'ok');
  }

  function b64enc(str) { var b = new TextEncoder().encode(str), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function b64dec(b64) { var s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); }
  function gh(method, body) {
    var o = { method: method, cache: 'no-store', headers: { 'Authorization': 'Bearer ' + sync.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
    if (body) { o.body = body; o.headers['Content-Type'] = 'application/json'; }
    return fetch('https://api.github.com/repos/' + sync.repo + '/contents/tasks.json', o);
  }
  function fail(c) { var e = new Error(c); e.code = c; return e; }
  function byId(a, b) { return a.id < b.id ? -1 : 1; }
  function payload() { return { v: 1, tasks: state.tasks.slice().sort(byId), deleted: state.deleted.slice().sort(byId) }; }
  function norm(p) {
    try { return JSON.stringify({ t: (p && Array.isArray(p.tasks) ? p.tasks : []).slice().sort(byId), d: (p && Array.isArray(p.deleted) ? p.deleted : []).slice().sort(byId) }); } catch (e) { return ''; }
  }

  function merge(remote) {
    var rt = remote && Array.isArray(remote.tasks) ? remote.tasks : [];
    var rd = remote && Array.isArray(remote.deleted) ? remote.deleted : [];
    var tombs = {}, map = {}, today = dayKey(), cutoff = Date.now() - 60 * 86400000;
    state.deleted.concat(rd).forEach(function (d) { if (d && typeof d.id === 'string') tombs[d.id] = Math.max(tombs[d.id] || 0, d.updated || 0); });
    state.tasks.concat(rt).forEach(function (t) {
      if (!t || typeof t.id !== 'string' || typeof t.title !== 'string') return;
      if (!map[t.id] || (t.updated || 0) > (map[t.id].updated || 0)) map[t.id] = t;
    });
    var out = [];
    Object.keys(map).forEach(function (id) {
      var t = map[id];
      if (tombs[id] !== undefined && tombs[id] >= (t.updated || 0)) return;
      out.push(t);
    });
    state.tasks = out;
    state.deleted = Object.keys(tombs).filter(function (id) { return tombs[id] > cutoff; }).map(function (id) { return { id: id, updated: tombs[id] }; });
    saveLocal(); render();
  }

  function once(n) {
    return gh('GET').then(function (res) {
      if (res.status === 404) return { sha: null, data: null };
      if (res.status === 401) throw fail('auth');
      if (res.status === 403) throw fail('forbidden');
      if (!res.ok) throw fail('http');
      return res.json().then(function (j) { var d = null; try { d = JSON.parse(b64dec(j.content)); } catch (e) {} return { sha: j.sha, data: d }; });
    }).then(function (remote) {
      var before = norm(remote.data);
      merge(remote.data);
      if (remote.sha && norm(payload()) === before) return;
      var body = { message: 'Sync tasks', content: b64enc(JSON.stringify(payload(), null, 1)) };
      if (remote.sha) body.sha = remote.sha;
      return gh('PUT', JSON.stringify(body)).then(function (res) {
        if (res.status === 409 || res.status === 422) { if (n < 3) return once(n + 1); throw fail('conflict'); }
        if (res.status === 404) throw fail('norepo');
        if (res.status === 401) throw fail('auth');
        if (res.status === 403) throw fail('forbidden');
        if (!res.ok) throw fail('http');
      });
    });
  }
  function doSync() {
    if (!syncOn()) return Promise.resolve();
    if (busy) { again = true; return Promise.resolve(); }
    busy = true; status('Syncing…');
    return once(1).then(function () { sync.lastOk = Date.now(); saveSync(); idleStatus(); }).catch(function (e) {
      var c = e && e.code;
      status(c === 'auth' ? 'Token rejected. Disconnect and paste a new one.' : c === 'forbidden' ? 'GitHub refused access. The token needs Contents: Read and write.' : c === 'norepo' ? 'Repo not found. Check the name.' : c === 'conflict' ? 'Collision, retrying…' : 'Offline. Will retry.', 'bad');
    }).then(function () { busy = false; if (again) { again = false; schedule(800); } });
  }
  function schedule(d) { if (!syncOn()) return; clearTimeout(timer); timer = setTimeout(doSync, d == null ? 1000 : d); }

  function changed() { saveLocal(); render(); schedule(); }

  function add(title) { state.tasks.push({ id: newId(), title: title, done: false, day: dayKey(), sessions: 0, updated: Date.now(), later: tab === 'later' }); changed(); }
  function move(t, later) { t.later = later; t.updated = Date.now(); changed(); }
  function toggle(t) { t.done = !t.done; t.doneDay = t.done ? dayKey() : null; t.completedAt = t.done ? Date.now() : null; t.updated = Date.now(); changed(); }
  function remove(t) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
    state.deleted.push({ id: t.id, updated: Date.now() });
    changed();
  }

  function render() {
    var list = $('list'); list.innerHTML = '';
    var today = dayKey();
    var all = state.tasks.filter(function (t) { return !(t.done && t.doneDay && t.doneDay < today); });
    var nT = all.filter(function (t) { return !t.later && !t.done; }).length, nL = all.filter(function (t) { return t.later && !t.done; }).length;
    $('nToday').textContent = nT ? ' ' + nT : ''; $('nLater').textContent = nL ? ' ' + nL : '';
    $('tabToday').className = 'tab' + (tab === 'today' ? ' on' : ''); $('tabLater').className = 'tab' + (tab === 'later' ? ' on' : '');
    $('input').placeholder = tab === 'later' ? 'Park something for later' : 'Add a task for today';
    $('empty').textContent = tab === 'later' ? 'Nothing parked for later. Type anything you don\u2019t want to think about today.' : 'Nothing on today\u2019s list. When someone gives you a task, type it above.';
    var items = all.filter(function (t) { return tab === 'later' ? !!t.later : !t.later; });
    items.sort(function (a, b) { return (a.done - b.done) || ((a.updated || 0) - (b.updated || 0)); });
    items.forEach(function (t) {
      var li = document.createElement('li'); li.className = t.done ? 'done' : '';
      var c = document.createElement('button'); c.type = 'button'; c.className = 'chk'; c.textContent = t.done ? '✓' : '';
      c.setAttribute('aria-label', (t.done ? 'Mark not done: ' : 'Mark done: ') + t.title);
      c.addEventListener('click', function () { toggle(t); });
      var s;
      if (editingId === t.id) {
        li.className += ' edit-on';
        s = document.createElement('input'); s.type = 'text'; s.className = 't-in'; s.value = t.title; s.maxLength = 300; s.setAttribute('aria-label', 'Edit task');
        var fin = false;
        var commit = function (val) { if (fin) return; fin = true; editingId = null; var v = (val || '').trim(); if (v && v !== t.title) { t.title = v; t.updated = Date.now(); changed(); } else render(); };
        s.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); commit(s.value); } else if (e.key === 'Escape') { commit(t.title); } });
        s.addEventListener('blur', function () { commit(s.value); });
        setTimeout(function () { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 30);
      } else {
        s = document.createElement('span'); s.className = 't'; s.textContent = t.title;
      }
      var m = document.createElement('button'); m.type = 'button'; m.className = 'mv'; m.textContent = t.later ? '\u2192 Today' : '\u2192 Later';
      m.addEventListener('click', function () { move(t, !t.later); });
      var d = document.createElement('button'); d.type = 'button'; d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', 'Delete: ' + t.title);
      d.addEventListener('click', function () { remove(t); });
      li.appendChild(c);
      var col = document.createElement('div'); col.className = 'tcol'; col.appendChild(s);
      li.appendChild(col);
      if (editingId !== t.id) {
        col.appendChild(m);
        var e = document.createElement('button'); e.type = 'button'; e.className = 'ed'; e.textContent = '\u270e'; e.setAttribute('aria-label', 'Edit: ' + t.title);
        e.addEventListener('click', function () { editingId = t.id; render(); });
        li.appendChild(e); li.appendChild(d);
      }
      list.appendChild(li);
    });
    $('empty').hidden = items.length > 0;
    var dn = state.tasks.filter(function (t) { return t.done; }).length; $('histN').textContent = dn ? '\u00b7 ' + dn : '';
    $('setup').hidden = syncOn();
    $('disc').hidden = !syncOn();
  }


  // --- Past tasks log ---
  var histRange = '7', histEdit = false;
  function doneDayOf(t) { return t.doneDay || t.day || dayKey(); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function histTasks() {
    var cutoff = histRange === 'all' ? null : histRange === 'today' ? dayKey() : addDays(-(parseInt(histRange, 10) - 1));
    return state.tasks.filter(function (t) { return t.done && (!cutoff || doneDayOf(t) >= cutoff); }).sort(function (a, b) {
      var da = doneDayOf(a), db = doneDayOf(b);
      if (da !== db) return da < db ? 1 : -1;
      return (b.completedAt || b.updated || 0) - (a.completedAt || a.updated || 0);
    });
  }
  function niceDay(k) {
    var p = k.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? k : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function timeOf(t) { return t.completedAt ? new Date(t.completedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''; }
  function hnote(m) { $('histNote').textContent = m; }

  function renderHist() {
    var items = histTasks(), box = $('histList');
    box.innerHTML = '';
    var sess = items.reduce(function (n, t) { return n + (t.sessions || 0); }, 0);
    var label = histRange === 'today' ? 'Today' : histRange === 'all' ? 'All time' : 'Last ' + histRange + ' days';
    $('histSub').textContent = label + ' \u00b7 ' + items.length + (items.length === 1 ? ' task done' : ' tasks done') + (sess ? ' \u00b7 ' + sess + ' focus sessions' : '') + ' \u00b7 as of ' + new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    $('histEdit').textContent = histEdit ? 'Done' : 'Edit';
    Array.prototype.forEach.call($('histSeg').children, function (b) { b.className = b.getAttribute('data-r') === histRange ? 'on' : ''; });
    if (!items.length) { var e = document.createElement('div'); e.className = 'hempty'; e.textContent = 'Nothing logged in this range. Tasks you tick off are recorded here automatically.'; box.appendChild(e); return; }
    var count = {}; items.forEach(function (t) { var k = doneDayOf(t); count[k] = (count[k] || 0) + 1; });
    var last = null;
    items.forEach(function (t) {
      var k = doneDayOf(t);
      if (k !== last) {
        var h = document.createElement('div'); h.className = 'day';
        var a = document.createElement('span'); a.textContent = niceDay(k);
        var c = document.createElement('span'); c.textContent = count[k] + ' done';
        h.appendChild(a); h.appendChild(c); box.appendChild(h); last = k;
      }
      var row = document.createElement('div'); row.className = 'row' + (histEdit ? ' edit' : '');
      if (!histEdit) {
        var tk = document.createElement('span'); tk.className = 'tick'; tk.textContent = '\u2713';
        var tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = t.title;
        var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = timeOf(t);
        row.appendChild(tk); row.appendChild(tt); row.appendChild(tm);
      } else {
        var main = document.createElement('div');
        var inp = document.createElement('input'); inp.type = 'text'; inp.value = t.title; inp.maxLength = 120;
        inp.addEventListener('change', function () { var v = inp.value.trim(); if (!v) { inp.value = t.title; return; } t.title = v; t.updated = Date.now(); changed(); });
        var dt = document.createElement('input'); dt.type = 'date'; dt.value = k;
        dt.addEventListener('change', function () { if (!dt.value) { dt.value = doneDayOf(t); return; } t.doneDay = dt.value; t.updated = Date.now(); changed(); renderHist(); });
        main.appendChild(inp); main.appendChild(dt);
        var del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '\u2715'; del.setAttribute('aria-label', 'Delete: ' + t.title);
        del.addEventListener('click', function () { if (window.confirm('Delete "' + t.title + '" from your log?')) { remove(t); renderHist(); } });
        row.appendChild(main); row.appendChild(del);
      }
      box.appendChild(row);
    });
  }

  function csvCell(v) { var s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function histRows() { return [['Date', 'Time', 'Task', 'Focus sessions']].concat(histTasks().map(function (t) { return [doneDayOf(t), timeOf(t), t.title, t.sessions || 0]; })); }
  function histCsv() { return histRows().map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n'; }
  function histTsv() { return histRows().map(function (r) { return r.map(function (c) { return String(c).replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\n'); }

  function copyText(text) {
    function fb() { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); return ok; }
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fb(); });
    return Promise.resolve(fb());
  }
  function shareCsv() {
    if (!histTasks().length) { hnote('Nothing to export yet.'); return; }
    var name = 'work-log-' + dayKey() + '.csv', text = '\ufeff' + histCsv();
    try {
      var file = new File([text], name, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Work log' }).catch(function () {}); return; }
    } catch (e) {}
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000); hnote('Saved ' + name);
    } catch (e) { hnote('Couldn\u2019t export. Try Copy.'); }
  }

  $('histOpen').addEventListener('click', function () { histEdit = false; $('hist').className = 'hist on'; hnote(''); renderHist(); $('hist').scrollTop = 0; });
  $('histBack').addEventListener('click', function () { $('hist').className = 'hist'; });
  $('histEdit').addEventListener('click', function () { histEdit = !histEdit; renderHist(); });
  $('histSeg').addEventListener('click', function (e) { var r = e.target && e.target.getAttribute && e.target.getAttribute('data-r'); if (r) { histRange = r; renderHist(); } });
  $('histShare').addEventListener('click', shareCsv);
  $('histCopy').addEventListener('click', function () { if (!histTasks().length) { hnote('Nothing to copy yet.'); return; } copyText(histTsv()).then(function (ok) { hnote(ok ? 'Copied. Paste it into Numbers, Excel or Sheets.' : 'Couldn\u2019t copy here.'); }); });

  loadLocal();
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  render(); idleStatus();
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('input').value.trim(); if (!v) return;
    add(v); $('input').value = ''; $('input').focus();
  });
  $('connect').addEventListener('click', function () {
    var r = $('repo').value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, ''), t = $('token').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(r) || !t) { status('Enter the repo and your token.', 'bad'); return; }
    sync.repo = r; sync.token = t; saveSync(); $('token').value = ''; render(); doSync();
  });
  $('tabToday').addEventListener('click', function () { tab = 'today'; render(); });
  $('tabLater').addEventListener('click', function () { tab = 'later'; render(); });
  $('refresh').addEventListener('click', function () { if (syncOn()) doSync(); });
  $('disc').addEventListener('click', function () { sync.repo = ''; sync.token = ''; sync.lastOk = 0; saveSync(); render(); idleStatus(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) schedule(300); });
  window.addEventListener('focus', function () { schedule(300); });
  setInterval(function () { if (!document.hidden) doSync(); }, 30000);
  if (syncOn()) doSync();
})();
</script>
</body>
</html>
