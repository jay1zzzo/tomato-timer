<body>

<script>
(function () {
  var TASKS_KEY = 'tomato-phone-tasks', SYNC_KEY = 'tomato-phone-sync';
  var state = { tasks: [], deleted: [] };
  var sync = { repo: '', token: '', lastOk: 0 };
  var tab = 'today';
  var busy = false, again = false, timer = null;
  function $(id) { return document.getElementById(id); }

  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function saveLocal() { try { localStorage.setItem(TASKS_KEY, JSON.stringify(state)); } catch (e) {} }
  function loadLocal() {
    try {
      var r = JSON.parse(localStorage.getItem(TASKS_KEY) || 'null');
      if (r && Array.isArray(r.tasks)) { state.tasks = r.tasks; state.deleted = Array.isArray(r.deleted) ? r.deleted : []; }
    } catch (e) {}
    try {
      var s = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
      if (s) { sync.repo = s.repo || ''; sync.token = s.token || ''; sync.lastOk = s.lastOk || 0; }
    } catch (e) {}
  }
  function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} }
  function syncOn() { return !!(sync.repo && sync.token); }

  function status(msg, kind) { $('st').textContent = msg; $('bar').className = 'bar' + (kind ? ' ' + kind : ''); }
  function idleStatus() {
    if (!syncOn()) { status('Not connected · tasks stay on this phone'); return; }
    var t = sync.lastOk ? new Date(sync.lastOk).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    status(t ? 'Synced ' + t : 'Connected', 'ok');
  }

  function b64enc(str) { var b = new TextEncoder().encode(str), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function b64dec(b64) { var s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); }
  function gh(method, body) {
    var o = { method: method, cache: 'no-store', headers: { 'Authorization': 'Bearer ' + sync.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
    if (body) { o.body = body; o.headers['Content-Type'] = 'application/json'; }
    return fetch('https://api.github.com/repos/' + sync.repo + '/contents/tasks.json', o);
  }
  function fail(c) { var e = new Error(c); e.code = c; return e; }
  function byId(a, b) { return a.id < b.id ? -1 : 1; }
  function payload() { return { v: 1, tasks: state.tasks.slice().sort(byId), deleted: state.deleted.slice().sort(byId) }; }
  function norm(p) {
    try { return JSON.stringify({ t: (p && Array.isArray(p.tasks) ? p.tasks : []).slice().sort(byId), d: (p && Array.isArray(p.deleted) ? p.deleted : []).slice().sort(byId) }); } catch (e) { return ''; }
  }

  function merge(remote) {
    var rt = remote && Array.isArray(remote.tasks) ? remote.tasks : [];
    var rd = remote && Array.isArray(remote.deleted) ? remote.deleted : [];
    var tombs = {}, map = {}, today = dayKey(), cutoff = Date.now() - 60 * 86400000;
    state.deleted.concat(rd).forEach(function (d) { if (d && typeof d.id === 'string') tombs[d.id] = Math.max(tombs[d.id] || 0, d.updated || 0); });
    state.tasks.concat(rt).forEach(function (t) {
      if (!t || typeof t.id !== 'string' || typeof t.title !== 'string') return;
      if (!map[t.id] || (t.updated || 0) > (map[t.id].updated || 0)) map[t.id] = t;
    });
    var out = [];
    Object.keys(map).forEach(function (id) {
      var t = map[id];
      if (tombs[id] !== undefined && tombs[id] >= (t.updated || 0)) return;
      out.push(t);
    });
    state.tasks = out;
    state.deleted = Object.keys(tombs).filter(function (id) { return tombs[id] > cutoff; }).map(function (id) { return { id: id, updated: tombs[id] }; });
    saveLocal(); render();
  }

  function once(n) {
    return gh('GET').then(function (res) {
      if (res.status === 404) return { sha: null, data: null };
      if (res.status === 401) throw fail('auth');
      if (res.status === 403) throw fail('forbidden');
      if (!res.ok) throw fail('http');
      return res.json().then(function (j) { var d = null; try { d = JSON.parse(b64dec(j.content)); } catch (e) {} return { sha: j.sha, data: d }; });
    }).then(function (remote) {
      var before = norm(remote.data);
      merge(remote.data);
      if (remote.sha && norm(payload()) === before) return;
      var body = { message: 'Sync tasks', content: b64enc(JSON.stringify(payload(), null, 1)) };
      if (remote.sha) body.sha = remote.sha;
      return gh('PUT', JSON.stringify(body)).then(function (res) {
        if (res.status === 409 || res.status === 422) { if (n < 3) return once(n + 1); throw fail('conflict'); }
        if (res.status === 404) throw fail('norepo');
        if (res.status === 401) throw fail('auth');
        if (res.status === 403) throw fail('forbidden');
        if (!res.ok) throw fail('http');
      });
    });
  }
  function doSync() {
    if (!syncOn()) return Promise.resolve();
    if (busy) { again = true; return Promise.resolve(); }
    busy = true; status('Syncing…');
    return lookOnce(1).then(function () { return once(1); }).then(function () { return bdOnce(1); }).then(function () { sync.lastOk = Date.now(); saveSync(); idleStatus(); }).catch(function (e) {
      var c = e && e.code;
      status(c === 'auth' ? 'Token rejected. Disconnect and paste a new one.' : c === 'forbidden' ? 'GitHub refused access. The token needs Contents: Read and write.' : c === 'norepo' ? 'Repo not found. Check the name.' : c === 'conflict' ? 'Collision, retrying…' : 'Offline. Will retry.', 'bad');
    }).then(function () { busy = false; if (again) { again = false; schedule(800); } });
  }
  function schedule(d) { if (!syncOn()) return; clearTimeout(timer); timer = setTimeout(doSync, d == null ? 1000 : d); }

  function changed() { saveLocal(); render(); schedule(); }

  // Optional date on a task: due 'YYYY-MM-DD', dueTime 'HH:MM'. Same rules as the desktop app.
  function dueOf(t) { return t && typeof t.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.due) ? t.due : ''; }
  function plusDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dueDays(t) { var p = function (k) { var x = k.split('-'); return Date.UTC(+x[0], x[1] - 1, +x[2]); }; return Math.round((p(dueOf(t)) - p(dayKey())) / 86400000); }
  function urgency(t) { var n = dueDays(t); return n < 0 ? 'overdue' : n <= 1 ? 'soon' : n <= 7 ? 'week' : 'far'; }
  function dueLabel(t) {
    var n = dueDays(t), x = dueOf(t).split('-'), dt = new Date(+x[0], x[1] - 1, +x[2]);
    var txt = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : dt.toLocaleDateString('en-GB', Math.abs(n) > 13 ? { weekday: 'short', day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric' }).replace(',', '');
    return txt + (t.dueTime ? ' \u00b7 ' + t.dueTime : '');
  }
  function setDue(t, due, time) { if (due) t.due = due; else delete t.due; if (due && time) t.dueTime = time; else delete t.dueTime; }
  // A dated task in Later shows in Today on its day, and stays there while overdue. Worked out here; nothing is rewritten.
  function pinned(t) { var d = dueOf(t); return !!d && d <= dayKey(); }
  // A dated task follows its date: today or earlier it is in Today; in the future it waits in Later and Upcoming
  // until its day, unless it is favourited, which keeps it in Today. Undated tasks use their list.
  function isLater(t) { var d = dueOf(t); if (d) return d > dayKey() && !t.starred; return t.later === true; }
  function move(t, later) { if (dueOf(t)) return; t.later = later; t.updated = Date.now(); changed(); }
  function toggle(t) { t.done = !t.done; t.doneDay = t.done ? dayKey() : null; t.completedAt = t.done ? Date.now() : null; t.updated = Date.now(); changed(); }

    var out = []; Object.keys(map).forEach(function (id) { if (tombs[id] !== undefined && tombs[id] >= (map[id].updated || 0)) return; out.push(map[id]); });
    bd.items = out; bd.deleted = Object.keys(tombs).filter(function (id) { return tombs[id] > cutoff; }).map(function (id) { return { id: id, updated: tombs[id] }; });
    if (remote && remote.w) bd.w = remote.w;
    bdSaveLocal();
  }
  function bdUpload() {
    var chain = Promise.resolve();
    bd.items.filter(function (it) { return it.type === 'i' && !it.remote; }).forEach(function (it) {
      chain = chain.then(function () { return idbGet(it.fid).then(function (blob) { if (!blob) return; return blobB64(blob).then(function (b64) {
        return ghf('PUT', JSON.stringify({ message: 'Add board picture', content: b64 }), 'board/' + it.fid).then(function (res) {
          if (res.status === 401) throw fail('auth'); if (res.status === 403) throw fail('forbidden'); if (res.status === 404) throw fail('norepo');
          if (res.ok || res.status === 422) { it.remote = true; bdSaveLocal(); }
        }); }); }); });
    });
    return chain;
  }
  function bdOnce(n) {
    return ghf('GET', null, 'board.json').then(function (res) {
      if (res.status === 404) return { sha: null, data: null };
      if (res.status === 401) throw fail('auth'); if (res.status === 403) throw fail('forbidden'); if (!res.ok) throw fail('http');
      return res.json().then(function (j) { var d = null; try { d = JSON.parse(b64dec(j.content)); } catch (e) {} return { sha: j.sha, data: d }; });
    }).then(function (remote) {
      bdMerge(remote.data);
      return bdUpload().then(function () {
        if (remote.sha && bdNorm(remote.data) === bdNorm(bdPayload())) return;
        if (!remote.sha && !bd.items.length && !bd.deleted.length) return;
        var body = { message: 'Sync board', content: b64enc(JSON.stringify(bdPayload(), null, 1)) }; if (remote.sha) body.sha = remote.sha;
        return ghf('PUT', JSON.stringify(body), 'board.json').then(function (res) {
          if (res.status === 409 || res.status === 422) { if (n < 3) return bdOnce(n + 1); throw fail('conflict'); }
          if (res.status === 404) throw fail('norepo'); if (res.status === 401) throw fail('auth'); if (res.status === 403) throw fail('forbidden'); if (!res.ok) throw fail('http');
        });
      });
    }).then(function () { if ($('bdp').className.indexOf('on') >= 0 && !bdEditing) bdRender(); });
  }
  function bdRender() {
    var box = $('bdList'); box.innerHTML = '';
    var items = bd.items.slice().sort(function (a, b) { return ((a.y || 0) - (b.y || 0)) || ((a.x || 0) - (b.x || 0)); });
    $('bdN').textContent = items.length ? items.length + (items.length === 1 ? ' item' : ' items') : '';
    if (!items.length) { var e = document.createElement('div'); e.className = 'hempty'; e.textContent = 'Nothing on your board yet. Add a line you want to remember, or a picture.'; box.appendChild(e); return; }
    items.forEach(function (it) {
      var c = document.createElement('div');
      if (it.type === 't') {
        c.className = 'bd-card t st-' + (it.style || 'bold'); c.textContent = it.text;
        c.style.color = it.color || '#f6f2e8';
        c.style.fontSize = Math.max(17, Math.min(58, Math.round((it.size || 30) * 0.58))) + 'px';
        c.addEventListener('click', function () {
          if (c.isContentEditable) return;
          bdEditing = it.id; c.contentEditable = 'true'; c.focus();
          var r = document.createRange(); r.selectNodeContents(c); r.collapse(false); var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);
          c.addEventListener('blur', function () { bdEditing = null; c.contentEditable = 'false'; var v = c.textContent.trim(); if (v && v !== it.text) { it.text = v; bdChanged(it); } else if (!v) { bdRemove(it); } else bdRender(); }, { once: true });
        });
      } else {
        c.className = 'bd-card i';
        c.style.width = Math.min(100, Math.max(45, Math.round((it.size || 240) / (bd.w || 1200) * 220))) + '%';
        var im = document.createElement('img'); im.alt = ''; c.appendChild(im);
        if (bdUrls[it.fid]) im.src = bdUrls[it.fid];
        else idbGet(it.fid).then(function (b) {
          if (b) { bdUrls[it.fid] = URL.createObjectURL(b); im.src = bdUrls[it.fid]; return; }
          if (!syncOn() || !it.remote) return;
          return ghf('GET', null, 'board/' + it.fid, 'application/vnd.github.raw+json').then(function (res) { return res.ok ? res.blob() : null; }).then(function (bl) {
            if (!bl) return; return idbPut(it.fid, bl).then(function () { bdUrls[it.fid] = URL.createObjectURL(bl); im.src = bdUrls[it.fid]; });
          }).catch(function () {});
        });
      }
      var x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove');
      x.addEventListener('click', function (e) { e.stopPropagation(); if (window.confirm('Remove this from your board?')) bdRemove(it); });
      c.appendChild(x); box.appendChild(c);
    });
  }
  function bdRemove(it) { bd.items = bd.items.filter(function (z) { return z.id !== it.id; }); bd.deleted.push({ id: it.id, updated: Date.now() }); bdSaveLocal(); bdRender(); schedule(); }
  function bdNextY() { return bd.items.reduce(function (m, z) { return Math.max(m, z.y || 0); }, 0) + 0.1; }
  function bdPrep(file) {
    return new Promise(function (res) {
      if (typeof createImageBitmap !== 'function' || /gif|svg/.test(file.type)) { res(file); return; }
      createImageBitmap(file).then(function (bm) {
        var sc = Math.min(1, 1600 / Math.max(bm.width, bm.height)), cv = document.createElement('canvas'); cv.width = Math.round(bm.width * sc); cv.height = Math.round(bm.height * sc);
        var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bm, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.86);
      }).catch(function () { res(file); });
    });
  }
  $('bdOpen').addEventListener('click', function () { $('bdp').className = 'bdp on'; bdRender(); $('bdp').scrollTop = 0; });
  $('bdBack').addEventListener('click', function () { $('bdp').className = 'bdp'; });
  $('bdForm').addEventListener('submit', function (e) {
    e.preventDefault(); var v = $('bdInput').value.trim(); if (!v) return;
    var it = { id: 'b' + newId(), type: 't', text: v, x: 0.06, y: bdNextY(), rot: 0, size: v.length < 24 ? 48 : 26, color: '#f4efe6', style: v.length < 24 ? 'bold' : 'italic' };
    bd.items.push(it); $('bdInput').value = ''; bdChanged(it);
  });
  $('bdPic').addEventListener('click', function () { $('bdFile').click(); });
  $('bdFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !/^image\//.test(f.type)) return;
    bdPrep(f).then(function (blob) { var fid = 'bd' + newId(); return idbPut(fid, blob).then(function () {
      var it = { id: 'b' + newId(), type: 'i', fid: fid, x: 0.25, y: bdNextY(), rot: 0, size: 240 }; bd.items.push(it); bdChanged(it); }); });
  });

  var PHONE_VERSION = 89;
  $('ver').textContent = 'v' + PHONE_VERSION;
  // Self-update: an iPhone home-screen app can keep an old copy of this page for a while. On opening (and when you
  // come back to it) ask GitHub for the newest page, bypassing the saved copy; if it is a newer version, reload into it.
  var verChecked = 0;
  function checkNewer() {
    if (Date.now() - verChecked < 60000) return;
    verChecked = Date.now();
    fetch('phone.html?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (html) {
      var m = /var PHONE_VERSION = (\d+);/.exec(html), v = m ? +m[1] : 0;
      if (v > PHONE_VERSION && !document.querySelector('.tsheet.on')) location.replace('phone.html?v=' + v);
    }).catch(function () {});
  }
  setTimeout(checkNewer, 1500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkNewer(); });
  loadLocal();
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  render(); idleStatus();
  $('connect').addEventListener('click', function () {
    var r = $('repo').value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, ''), t = $('token').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(r) || !t) { status('Enter the repo and your token.', 'bad'); return; }
    sync.repo = r; sync.token = t; saveSync(); $('token').value = ''; render(); doSync();
  });
  $('tabToday').addEventListener('click', function () { tab = 'today'; render(); });
  $('tabLater').addEventListener('click', function () { tab = 'later'; render(); });
  $('tabUp').addEventListener('click', function () { tab = 'upcoming'; render(); });
  $('refresh').addEventListener('click', function () { if (syncOn()) doSync(); });
  $('disc').addEventListener('click', function () { sync.repo = ''; sync.token = ''; sync.lastOk = 0; saveSync(); render(); idleStatus(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) schedule(300); });
  window.addEventListener('focus', function () { schedule(300); });
  setInterval(function () { if (!document.hidden) doSync(); }, 30000);
  if (syncOn()) doSync();
})();
</script>
